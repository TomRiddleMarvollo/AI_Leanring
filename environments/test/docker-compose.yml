version: '3.8'

services:
  db_test:
    image: postgres:15-alpine
    container_name: aihub_db_test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: aihub_test
    ports:
      - "5433:5432"           # port khác prod để chạy song song
    tmpfs:
      - /var/lib/postgresql/data  # không persist — reset sạch mỗi lần test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d aihub_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend_test:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile
    container_name: aihub_backend_test
    env_file: .env
    volumes:
      - ../../src/backend:/app
      - ../../config.yaml:/app/config.yaml
      - ../../prompts:/app/prompts
      - ../../tests:/app/tests
    depends_on:
      db_test:
        condition: service_healthy
    command: >
      sh -c "pip install pytest pytest-asyncio httpx -q &&
             pytest tests/ -v --tb=short"
