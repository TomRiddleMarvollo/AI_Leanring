version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: aihub_searxng_dev
    volumes:
      - ../../searxng:/etc/searxng:ro
    ports:
      - "8888:8080"          # host access for debugging only; backend talks to it over the internal network
    restart: unless-stopped

  backend:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile
    container_name: aihub_backend_dev
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///./data/dev.db
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - ../../src/backend:/app          # hot-reload source
      - ../../config.yaml:/app/config.yaml
      - ../../prompts:/app/prompts
      - ../../data:/app/data
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: aihub_frontend_dev
    working_dir: /app
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ../../src/frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
