version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aihub_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aihub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aihub"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: aihub_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Optional: Automatically pull llama3 model on startup. 
    # This might take time the first run.
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 5 && ollama pull llama3 && wait"

  backend:
    build: ./backend
    container_name: aihub_backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/aihub
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=llama3
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aihub_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
